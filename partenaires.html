<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Partenaires — Tekno Never Dies</title><meta name="description" content="Partenaires et collaborations de Tekno Never Dies."><link rel="icon" href="assets/img/favicon.png"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script><script type="module" src="js/main.js"></script><script type="module" src="js/partials.js"></script></head><body data-page="contact"><canvas id="stage" aria-hidden="true"></canvas><div data-include="partials/header.html"></div><main><section class="page-head container"><h1>Partenaires</h1><p>Associations, collectifs, lieux et acteurs avec lesquels nous construisons des projets.</p></section><section class="container" style="padding-bottom:70px"><div id="partners" class="content-grid"></div><div class="cta-panel"><h2>Devenir partenaire</h2><p>Vous souhaitez collaborer avec l'association sur un événement, un lieu ou un projet ?</p><a class="btn btn-cyan" href="contact.html">Proposer une collaboration</a></div></section></main><div data-include="partials/footer.html"></div><script type="module">import { PARTENAIRES } from './js/data/partenaires.js'; const root=document.querySelector('#partners'); root.innerHTML=PARTENAIRES.length ? PARTENAIRES.map(p=>`<article class="info-card"><h2>${p.name}</h2><p><strong>${p.type}</strong></p><p>${p.description}</p>${p.url?`<a class="btn btn-line btn-sm" href="${p.url}" target="_blank" rel="noopener">Voir le partenaire</a>`:''}</article>`).join('') : '<article class="info-card"><h2>Partenaires à venir</h2><p>Cette page sera complétée lorsque les partenariats officiels de l’association auront été renseignés.</p></article>';</script></body></html>
