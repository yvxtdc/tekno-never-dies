name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Le site officiel est publié uniquement depuis ce dépôt (évite des copies en double ailleurs).
    if: github.repository == 'yvxtdc/tekno-never-dies'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate site
        run: npm run validate

      - name: Check calendar is up to date
        run: node tools/generate-calendar.mjs --check

      # Seuls les fichiers utiles aux visiteurs sont publiés (pas les outils, le README, etc.).
      - name: Build public folder
        run: |
          mkdir _site
          rsync -a \
            --exclude '.*' --exclude '_site' --exclude 'node_modules' --exclude 'import' --exclude 'dist' \
            --exclude 'tools' --exclude 'partials' --exclude 'README.md' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude 'serve.json' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5