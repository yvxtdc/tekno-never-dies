name: Tests

# Tests du CMS et validation du site sur chaque demande de fusion (le déploiement, lui, est dans
# deploy-pages.yml). Rien n'est publié ici.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site
        run: npm run validate

      - name: CMS tests
        run: npm test
