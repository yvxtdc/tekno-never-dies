<!doctype html>
<!--
  Modèle de l'image d'aperçu des liens partagés : assets/img/og-image.jpg (1200 × 630).
  Pour la refaire : ouvrir ce fichier avec Live Server (il utilise les polices et images du site),
  fenêtre de 1200 × 630, puis faire une capture de la page en JPEG (qualité 85, moins de 300 Ko
  pour WhatsApp). Les textes importants restent au centre : certaines applis recadrent les bords.
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Image d'aperçu — Tekno Never Dies</title>
<style>
  @font-face{font-family:"Archivo Black";src:url("../assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Montserrat";font-weight:600;src:url("../assets/fonts/montserrat-latin-600-normal.woff2") format("woff2")}
  @font-face{font-family:"Montserrat";font-weight:700;src:url("../assets/fonts/montserrat-latin-700-normal.woff2") format("woff2")}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0722}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;font-family:"Montserrat",sans-serif;isolation:isolate}
  .photo{position:absolute;inset:-20px;z-index:-3;background:url("../assets/img/events/soiree1.webp") center 40%/cover;filter:saturate(.75) brightness(.42)}
  .shade{position:absolute;inset:0;z-index:-2;background:
    radial-gradient(48% 70% at 86% 12%, rgba(149,106,255,.42), transparent 70%),
    radial-gradient(40% 60% at 6% 100%, rgba(182,38,154,.34), transparent 70%),
    linear-gradient(90deg, rgba(11,7,34,.92) 0%, rgba(11,7,34,.62) 55%, rgba(11,7,34,.8) 100%)}
  .thorn{position:absolute;z-index:-1;width:330px;right:-40px;top:-30px;transform:rotate(14deg);opacity:.9;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
  .burst{position:absolute;z-index:-1;width:110px;right:150px;bottom:60px;opacity:.85;transform:rotate(-12deg)}
  .content{position:absolute;inset:0;display:flex;align-items:center;gap:56px;padding:0 84px}
  .logo{flex:none;width:250px;height:250px;border-radius:50%;background:url("../assets/img/badge-white.webp") center/100% 100%;box-shadow:0 0 0 6px rgba(149,106,255,.35),0 24px 60px rgba(0,0,0,.55)}
  .kicker{margin:0 0 18px;display:flex;align-items:center;gap:14px;color:#c1b1ff;font-weight:700;font-size:20px;letter-spacing:.2em;text-transform:uppercase}
  .kicker i{display:block;width:44px;height:2px;background:linear-gradient(90deg,#956aff,#b6269a)}
  h1{margin:0;font-family:"Archivo Black",sans-serif;font-weight:400;text-transform:uppercase;line-height:.92;letter-spacing:-.01em}
  h1 .a{display:block;font-size:104px;text-shadow:5px 5px 0 #4226b6}
  h1 .b{display:block;font-size:104px;background:linear-gradient(105deg,#fff 4%,#c1b1ff 28%,#956aff 58%,#b6269a 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{margin:26px 0 0;font-weight:600;font-size:30px;color:#fff}
  .url{margin:12px 0 0;font-weight:700;font-size:20px;letter-spacing:.08em;color:rgba(255,255,255,.62)}
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="shade"></div>
    <img class="thorn" src="../assets/img/decor/thorn.webp" alt="" />
    <img class="burst" src="../assets/img/decor/burst.webp" alt="" />
    <div class="content">
      <div class="logo" role="img" aria-label="Logo Tekno Never Dies"></div>
      <div>
        <p class="kicker">TND6TEM <i></i> Lauterbourg · Alsace</p>
        <h1><span class="a">Tekno</span><span class="b">Never Dies</span></h1>
        <p class="tagline">Association &amp; sound system tekno</p>
        <p class="url">teknoneverdies.fr</p>
      </div>
    </div>
  </div>
</body>
</html>
