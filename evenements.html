<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Événements — Tekno Never Dies</title>
  <meta name="description" content="Prochains événements et soirées passées de l'association Tekno Never Dies." />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="preload" href="assets/fonts/archivo-black-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/partials.js"></script>
</head>
<body data-page="evenements">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="page-head container">
      <p class="page-kicker">l'agenda</p>
      <h1><span class="l2">Événements</span></h1>
      <img class="decor decor-r decor--float" src="assets/img/decor/star-pair.webp" alt="" aria-hidden="true" />
      <p>Nos prochaines soirées, et un aperçu de celles déjà organisées.</p>
    </section>

    <section class="container events-block">
      <div class="section-heading">
        <h2 class="section-title">À venir</h2>
        <div class="section-heading__actions">
          <button class="btn btn-line btn-sm" type="button" id="download-agenda">Ajouter à mon agenda</button>
          <button class="btn btn-line btn-sm" type="button" id="copy-events-link">Partager l'agenda</button>
        </div>
      </div>
      <div class="listing-tools" aria-label="Filtres des événements">
        <label class="search-field">
          <span>Rechercher</span>
          <input id="event-search" type="search" placeholder="Nom, lieu ou description" />
        </label>
        <label class="select-field">
          <span>Afficher</span>
          <select id="event-filter">
            <option value="tous">Tous les événements</option>
            <option value="a-venir">À venir</option>
            <option value="passe">Passés</option>
          </select>
        </label>
      </div>
      <p class="form-status" id="events-status" role="status" aria-live="polite"></p>
      <ul class="card-grid" id="upcoming-events"></ul>
    </section>

    <section class="container events-block has-decor" id="past-events-block">
      <img class="decor decor-r2" style="top:-14px" src="assets/img/decor/sparkle-blue.webp" alt="" aria-hidden="true" />
      <h2 class="section-title">Événements passés</h2>
      <ul class="card-grid" id="past-events"></ul>
    </section>

    <a class="cta-row" href="contact.html">
      <span class="cta-row__inner">
        <span class="cta-row__kicker">Une soirée à organiser ensemble ?</span>
        <span class="cta-row__title"><span>Écris-nous</span> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M14 5l7 7-7 7"/></svg></span>
      </span>
    </a>
  </main>

  <div data-include="partials/footer.html"></div>
  <script type="module" src="js/pages/evenements.js"></script>
</body>
</html>
