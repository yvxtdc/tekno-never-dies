<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Actualités — Tekno Never Dies</title><meta name="description" content="Actualités et informations de Tekno Never Dies."><link rel="icon" href="assets/img/favicon.png"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script><script type="module" src="js/main.js"></script><script type="module" src="js/partials.js"></script></head><body><canvas id="stage" aria-hidden="true"></canvas><div data-include="partials/header.html"></div><main><section class="page-head container"><h1>Actualités</h1><p>Les nouvelles de l'association, des événements et du matériel.</p></section><section class="container article-list" style="padding-bottom:100px" id="news"></section></main><div data-include="partials/footer.html"></div><script type="module">import { ACTUALITES } from './js/data/actualites.js'; const f=new Intl.DateTimeFormat('fr-FR',{dateStyle:'long'}); document.querySelector('#news').innerHTML=ACTUALITES.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<article class="article-card"><div class="date">${f.format(new Date(a.date+'T12:00:00'))}</div><h2>${a.title}</h2><p><strong>${a.excerpt}</strong></p><p>${a.content}</p></article>`).join('');</script></body></html>
